name: example
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  my_boxy_ds:
    path: ../
  flutter_lucide: ^1.41.0
  flutter_svg: ^2.3.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - ../assets/images/ic_mastercard.png
    - ../assets/images/ic_mastercard.svg

  fonts:
    - family: Lexend
      fonts:
        - asset: ../assets/fonts/Lexend-Thin.ttf
        - asset: ../assets/fonts/Lexend-SemiBold.ttf
        - asset: ../assets/fonts/Lexend-Medium.ttf
        - asset: ../assets/fonts/Lexend-Black.ttf
        - asset: ../assets/fonts/Lexend-Bold.ttf
        - asset: ../assets/fonts/Lexend-ExtraBold.ttf
        - asset: ../assets/fonts/Lexend-ExtraLight.ttf
        - asset: ../assets/fonts/Lexend-Light.ttf
        - asset: ../assets/fonts/Lexend-Regular.ttf
    - family: SFMono
      fonts:
        - asset: ../assets/fonts/SFMonoBold.otf
        - asset: ../assets/fonts/SFMonoBoldItalic.otf
        - asset: ../assets/fonts/SFMonoRegular.otf
        - asset: ../assets/fonts/SFMonoRegularItalic.otf
        - asset: ../assets/fonts/SFMonoSemiBold.otf
        - asset: ../assets/fonts/SFMonoSemiBoldItalic.otf
        - asset: ../assets/fonts/SFMonoLight.otf
        - asset: ../assets/fonts/SFMonoLightItalic.otf
        - asset: ../assets/fonts/SFMonoMedium.otf
        - asset: ../assets/fonts/SFMonoMediumItalic.otf
        - asset: ../assets/fonts/SFMonoHeavyItalic.otf
        - asset: ../assets/fonts/SFMonoHeavy.otf